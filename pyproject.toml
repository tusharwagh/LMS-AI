[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-ai"
version = "0.1.0"
description = "LMS-AI — K-12 Library Management System (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "litellm>=1.55.0",
    "langfuse>=4.0,<5",
]

[project.optional-dependencies]
guardrails = [
    "nemoguardrails>=0.22.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.7.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
    "import-linter>=2.1",
    "nemoguardrails>=0.22.0",
]

[project.scripts]
lms = "lms.main:main"

[tool.hatch.build]
directory = "src"

[tool.hatch.build.targets.wheel]
packages = ["lms"]

[tool.hatch.build.targets.wheel.force-include]
"src/lms/staff/static" = "lms/staff/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests with database",
    "e2e: end-to-end journey tests",
    "playwright: browser E2E via Playwright",
    "hardening: Phase 7 concurrency and idempotency regression",
    "performance: Phase 7 SLO baseline checks",
    "agent: Phase 8 agent desk tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501"]
"src/lms/agent/llm_intent_prompt.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lms"]
mypy_path = "src"
exclude = ["^\\.venv/", "^\\.mypy_cache/"]

[[tool.mypy.overrides]]
module = ["jose.*", "nemoguardrails.*"]
ignore_missing_imports = true

# Skip deep traversal of heavy third-party trees (faster CI; avoids OneDrive
# timeouts when .venv files are cloud-only).
[[tool.mypy.overrides]]
module = [
    "markdown_it.*",
    "mdurl.*",
    "langchain.*",
    "langchain_core.*",
    "langgraph.*",
    "langfuse.*",
    "langsmith.*",
]
follow_imports = "skip"

[tool.importlinter]
root_package = "lms"

[[tool.importlinter.contracts]]
name = "Reference must not import Catalog or Loan infrastructure"
type = "forbidden"
source_modules = ["lms.reference"]
forbidden_modules = [
    "lms.catalog.infrastructure",
    "lms.loan.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Catalog must not import Reference or Loan infrastructure"
type = "forbidden"
source_modules = ["lms.catalog"]
forbidden_modules = [
    "lms.reference.infrastructure",
    "lms.loan.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Loan must not import Reference or Catalog infrastructure"
type = "forbidden"
source_modules = ["lms.loan"]
forbidden_modules = [
    "lms.reference.infrastructure",
    "lms.catalog.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Agent must not import domain infrastructure"
type = "forbidden"
source_modules = ["lms.agent"]
forbidden_modules = [
    "lms.reference.infrastructure",
    "lms.catalog.infrastructure",
    "lms.loan.infrastructure",
]
ignore_imports = [
    "lms.agent.coordinator -> lms.api.workflows.search_and_issue",
    "lms.agent.coordinator -> lms.api.workflows.return_book",
    "lms.agent.coordinator -> lms.loan.application.fulfillment_service",
    "lms.agent.tools -> lms.api.workflows.search_and_issue",
    "lms.agent.tools -> lms.api.workflows.return_book",
    "lms.agent.tools -> lms.loan.application.fulfillment_service",
]

[[tool.importlinter.contracts]]
name = "Shared must not import platform or bounded contexts"
type = "forbidden"
source_modules = ["lms.shared"]
forbidden_modules = [
    "lms.platform",
    "lms.catalog",
    "lms.loan",
    "lms.reference",
    "lms.agent",
]

[[tool.importlinter.contracts]]
name = "Platform must not import bounded context infrastructure"
type = "forbidden"
source_modules = ["lms.platform"]
forbidden_modules = [
    "lms.catalog.infrastructure",
    "lms.loan.infrastructure",
    "lms.reference.infrastructure",
    "lms.agent",
]
