[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-ai"
version = "0.1.0"
description = "LMS-AI — K-12 Library Management System (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[project.scripts]
lms = "lms.main:main"

[tool.hatch.build]
directory = "src"

[tool.hatch.build.targets.wheel]
packages = ["lms"]

[tool.hatch.build.targets.wheel.force-include]
"lms/staff/static" = "lms/staff/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests with database",
    "e2e: end-to-end journey tests",
    "hardening: Phase 7 concurrency and idempotency regression",
    "performance: Phase 7 SLO baseline checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lms"]
mypy_path = "src"

[tool.importlinter]
root_package = "lms"

[[tool.importlinter.contracts]]
name = "Reference must not import Catalog or Loan infrastructure"
type = "forbidden"
source_modules = ["lms.reference"]
forbidden_modules = [
    "lms.catalog.infrastructure",
    "lms.loan.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Catalog must not import Reference or Loan infrastructure"
type = "forbidden"
source_modules = ["lms.catalog"]
forbidden_modules = [
    "lms.reference.infrastructure",
    "lms.loan.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Loan must not import Reference or Catalog infrastructure"
type = "forbidden"
source_modules = ["lms.loan"]
forbidden_modules = [
    "lms.reference.infrastructure",
    "lms.catalog.infrastructure",
]
