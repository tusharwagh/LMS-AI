<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS Staff Desk</title>
    <link rel="stylesheet" href="/staff/static/styles.css" />
  </head>
  <body>
    <div id="login-view">
      <div class="login-card">
        <h1>Library Staff Desk</h1>
        <p>Sign in to issue, return, and search catalog.</p>
        <div id="login-error" class="alert error hidden"></div>
        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem">Sign in</button>
        </form>
      </div>
    </div>

    <div id="app-shell" class="hidden">
      <nav>
        <div class="brand">LMS Staff</div>
        <div class="user" id="nav-user"></div>
        <button type="button" data-view="issue" class="nav-btn active">Issue book</button>
        <button type="button" data-view="return" class="nav-btn">Return book</button>
        <button type="button" data-view="search" class="nav-btn">Catalog search</button>
        <button type="button" data-view="overdue" class="nav-btn">Overdue</button>
        <button type="button" data-view="patron" class="nav-btn">Patron lookup</button>
        <button type="button" data-view="admin" class="nav-btn admin-only hidden">Admin</button>
        <button type="button" id="logout-btn" class="logout">Sign out</button>
      </nav>

      <main>
        <!-- Issue wizard -->
        <section id="view-issue" class="view">
          <div class="panel">
            <h2>Issue a book</h2>
            <div class="steps" id="issue-steps">
              <span class="step active" data-step="1">1. Patron</span>
              <span class="step" data-step="2">2. Search</span>
              <span class="step" data-step="3">3. Copy</span>
              <span class="step" data-step="4">4. Fulfillment</span>
            </div>
            <div id="issue-alert"></div>

            <div id="issue-step-1">
              <div class="row">
                <div>
                  <label for="issue-card">Card barcode</label>
                  <input id="issue-card" placeholder="Scan or type card barcode" />
                </div>
                <div>
                  <label for="issue-admission">Admission no.</label>
                  <input id="issue-admission" placeholder="External reference" />
                </div>
              </div>
              <label for="issue-name">Patron name</label>
              <input id="issue-name" placeholder="Search by display name" />
              <div class="row" style="margin-top: 0.5rem">
                <button type="button" class="btn" id="issue-patron-btn">Find patron</button>
                <button type="button" class="btn secondary" id="issue-name-search-btn">Search by name</button>
              </div>
              <div id="issue-patron-candidates" style="margin-top: 1rem"></div>
              <div id="issue-patron-info" class="hidden" style="margin-top: 1rem"></div>
            </div>

            <div id="issue-step-2" class="hidden">
              <label for="issue-search">Search title / ISBN / call no.</label>
              <input id="issue-search" placeholder="e.g. Python, 978..." />
              <div class="row">
                <button type="button" class="btn" id="issue-search-btn">Search lendable copies</button>
                <button type="button" class="btn secondary" id="issue-back-step-1">Back</button>
              </div>
              <div id="issue-search-results" style="margin-top: 1rem"></div>
            </div>

            <div id="issue-step-3" class="hidden">
              <p id="issue-selected-title" class="meta"></p>
              <div id="issue-copies"></div>
              <div class="row">
                <button type="button" class="btn secondary" id="issue-back-step-2">Back</button>
              </div>
            </div>

            <div id="issue-step-4" class="hidden">
              <p id="issue-commit-summary"></p>
              <label for="issue-mode">Fulfillment</label>
              <select id="issue-mode">
                <option value="DESK">Desk — hand to patron now</option>
                <option value="DELIVERY">Delivery to class / home</option>
                <option value="PICKUP_POINT">Pick-up point</option>
              </select>
              <div id="issue-destination-fields" class="hidden">
                <label for="issue-dest-notes">Destination notes</label>
                <textarea id="issue-dest-notes" placeholder="Class, room, address"></textarea>
                <label for="issue-dest-contact">Contact</label>
                <input id="issue-dest-contact" placeholder="Phone or email" />
              </div>
              <div id="issue-validate-result"></div>
              <div class="row">
                <button type="button" class="btn" id="issue-commit-btn">Commit issue</button>
                <button type="button" class="btn secondary" id="issue-back-step-3">Back</button>
              </div>
            </div>

            <div id="issue-done" class="hidden">
              <div class="alert success" id="issue-done-msg"></div>
              <div class="row">
                <button type="button" class="btn secondary" id="issue-new-btn">Issue another</button>
                <button type="button" class="btn" id="issue-cancel-btn" style="background: var(--danger)">Cancel issuance</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Return wizard -->
        <section id="view-return" class="view hidden">
          <div class="panel">
            <h2>Return a book</h2>
            <div id="return-alert"></div>

            <div id="return-step-1">
              <label for="return-barcode">Holding barcode</label>
              <input id="return-barcode" placeholder="Scan book barcode" />
              <button type="button" class="btn" id="return-lookup-btn">Look up loan</button>
            </div>

            <div id="return-step-2" class="hidden">
              <div id="return-context"></div>
              <label for="return-action">Return method</label>
              <select id="return-action">
                <option value="desk">Desk return — item at counter</option>
                <option value="pickup">Schedule pick-up collection</option>
              </select>
              <div id="return-pickup-fields" class="hidden">
                <label for="return-pickup-notes">Pick-up notes</label>
                <textarea id="return-pickup-notes" placeholder="Address, contact time"></textarea>
              </div>
              <button type="button" class="btn" id="return-commit-btn">Complete return</button>
              <button type="button" class="btn secondary" id="return-reset-btn">Scan another</button>
            </div>

            <div id="return-done" class="hidden">
              <div class="alert success" id="return-done-msg"></div>
            </div>
          </div>
        </section>

        <!-- Catalog search -->
        <section id="view-search" class="view hidden">
          <div class="panel">
            <h2>Catalog search</h2>
            <div id="search-alert"></div>
            <label for="catalog-query">Search published titles with available copies</label>
            <input id="catalog-query" placeholder="Title, ISBN, call number" />
            <button type="button" class="btn" id="catalog-search-btn">Search</button>
            <div id="catalog-results" style="margin-top: 1rem"></div>
          </div>
        </section>

        <!-- Overdue -->
        <section id="view-overdue" class="view hidden">
          <div class="panel">
            <h2>Overdue loans</h2>
            <div id="overdue-alert"></div>
            <button type="button" class="btn secondary" id="overdue-refresh-btn">Refresh</button>
            <div id="overdue-results" style="margin-top: 1rem"></div>
          </div>
        </section>

        <!-- Patron lookup -->
        <section id="view-patron" class="view hidden">
          <div class="panel">
            <h2>Patron lookup</h2>
            <div id="patron-alert"></div>
            <div class="row">
              <div>
                <label for="patron-card">Card barcode</label>
                <input id="patron-card" />
              </div>
              <div>
                <label for="patron-ref">Admission no.</label>
                <input id="patron-ref" />
              </div>
            </div>
            <label for="patron-name">Patron name</label>
            <input id="patron-name" placeholder="Search by display name" />
            <button type="button" class="btn" id="patron-lookup-btn">Look up</button>
            <div id="patron-result" style="margin-top: 1rem"></div>
          </div>
        </section>

        <!-- Admin -->
        <section id="view-admin" class="view hidden">
          <div class="panel">
            <h2>Administration</h2>
            <div id="admin-alert"></div>
            <h3>Loan rule sets</h3>
            <div class="row">
              <div><input id="admin-rule-name" placeholder="Name" /></div>
              <div><input id="admin-rule-max" type="number" min="0" placeholder="Max loans" value="3" /></div>
              <div><input id="admin-rule-days" type="number" min="1" placeholder="Loan days" value="14" /></div>
            </div>
            <button type="button" class="btn" id="admin-rule-create">Add rule set</button>
            <div id="admin-rules-list" style="margin: 1rem 0"></div>

            <h3>Patron types</h3>
            <div class="row">
              <div><input id="admin-type-code" placeholder="Code e.g. STUDENT" /></div>
              <div><input id="admin-type-name" placeholder="Display name" /></div>
            </div>
            <button type="button" class="btn" id="admin-type-create">Add patron type</button>
            <div id="admin-types-list" style="margin: 1rem 0"></div>

            <h3>Class sections</h3>
            <div class="row">
              <div><input id="admin-grade" placeholder="Grade" /></div>
              <div><input id="admin-section" placeholder="Section" /></div>
              <div><input id="admin-year" placeholder="Academic year" value="2025-26" /></div>
            </div>
            <button type="button" class="btn" id="admin-section-create">Add class section</button>
            <div id="admin-sections-list" style="margin-top: 1rem"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/staff/static/app.js" type="module"></script>
  </body>
</html>
