name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://lms:lms@localhost:5432/lms
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install staff UI dependencies
        run: make staff-ui-install

      - name: Build staff UI
        run: make staff-ui-build

      - name: Typecheck staff UI
        run: make staff-ui-typecheck

      - name: npm audit (root diagram deps)
        run: npm audit --audit-level=high

      - name: npm audit (staff UI)
        run: cd src/lms/staff/ui && npm audit --audit-level=high

      - name: Verify diagram script
        run: npm run diagram

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Ruff
        run: ruff check src tests

      - name: Import linter
        run: lint-imports
        env:
          PYTHONPATH: src

      - name: Mypy
        run: mypy

      - name: Migrate database
        run: python -m alembic upgrade head

      - name: Pytest
        run: pytest
        env:
          PYTHONPATH: src

      - name: Docker build
        run: docker build -t lms-ai:ci .

      - name: Check template standards drift (warn-only, Phase 3)
        if: hashFiles('standards/manifest.json') != ''
        run: |
          chmod +x standards/scripts/check-standards.sh
          set +e
          STANDARDS_ROOT="$PWD" STANDARDS_REFERENCE=standards \
            STANDARDS_MANIFEST=standards/manifest.json \
            STANDARDS_VERSION_FILE=.standards-version \
            STANDARDS_LATEST_FILE=.standards-latest \
            STANDARDS_PROFILES_FILE=.standards-profiles \
            CI_POLICY=warn \
            ./standards/scripts/check-standards.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then echo "check-standards: warn (allowed)"; exit 0; fi
          exit "$rc"
        continue-on-error: true
